name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
    inputs:
      ref:
        description: Exact branch or tag to validate and package
        type: string
        default: ''
      package:
        description: Build and upload native installers after all checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            bundles: nsis
          - platform: macos-arm64
            os: macos-15
            bundles: app,dmg
          - platform: macos-x64
            os: macos-15-intel
            bundles: app,dmg
          - platform: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf fonts-dejavu
      - run: npm ci
      - run: npm run check:version
      - run: npm run format:check
      - run: npm run prepare:sidecar
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Install UI test browser
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            test-results/
            artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package native installers
        if: inputs.package == true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Verify packaged MCP stdio
        if: inputs.package == true
        run: npm run test:native-mcp
      - name: Collect installers and checksums
        if: inputs.package == true
        run: node scripts/collect-installers.mjs ${{ matrix.platform }}
      - name: Verify updater signatures and tamper rejection
        if: inputs.package == true
        env:
          TETHER_UPDATER_ARTIFACTS: ../artifacts/installers/${{ matrix.platform }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test updater_signatures -- --ignored
      - name: Upload installers
        if: inputs.package == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tether-${{ matrix.platform }}
          path: artifacts/installers/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  required:
    name: Required checks
    if: always()
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every platform to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
